<script type="text/x-dc" data-dc-script data-props="{&quot;active&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;home&quot;,&quot;cenovnik&quot;,&quot;edukacije&quot;],&quot;default&quot;:&quot;home&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;overHero&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;}}">
class Component extends DCLogic {
  state = { scrolled: false, bar: false, menu: false, status: null };
  status() {
    const p = new Intl.DateTimeFormat('en-GB', { timeZone: 'Europe/Belgrade', weekday: 'short', hour: '2-digit', minute: '2-digit', hour12: false }).formatToParts(new Date());
    const g = t => (p.find(x => x.type === t) || {}).value;
    const d = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'].indexOf(g('weekday'));
    const m = (+g('hour') % 24) * 60 + +g('minute');
    const close = d < 5 ? 1260 : d === 5 ? 900 : 0;
    const open = close > 0 && m >= 540 && m < close;
    let label;
    if (open) label = 'Otvoreno · danas do ' + (d < 5 ? '21:00' : '15:00');
    else if (close && m < 540) label = 'Zatvoreno · otvaramo u 09:00';
    else if (d === 5) label = 'Zatvoreno · otvaramo u ponedeljak u 09:00';
    else label = 'Zatvoreno · otvaramo sutra u 09:00';
    return { open, label };
  }
  componentDidMount() {
    this.onScroll = () => {
      const y = window.scrollY;
      const s = y > 40, b = y > (this.props.overHero ? window.innerHeight * 0.7 : 240);
      if (s !== this.state.scrolled || b !== this.state.bar) this.setState({ scrolled: s, bar: b });
    };
    this.onKey = e => { if (e.key === 'Escape' && this.state.menu) this.setMenu(false); };
    window.addEventListener('scroll', this.onScroll, { passive: true });
    window.addEventListener('keydown', this.onKey);
    this.onScroll();
    this.setState({ status: this.status() });
    this.timer = setInterval(() => this.setState({ status: this.status() }), 60000);
  }
  componentWillUnmount() {
    window.removeEventListener('scroll', this.onScroll);
    window.removeEventListener('keydown', this.onKey);
    clearInterval(this.timer);
  }
  setMenu(v) {
    this.setState({ menu: v });
    document.body.style.overflow = v ? 'hidden' : '';
    if (v) setTimeout(() => this.closeEl && this.closeEl.focus(), 60);
  }
  renderVals() {
    const active = this.props.active || 'home';
    const over = !!this.props.overHero;
    const { scrolled, menu, bar } = this.state;
    const st = this.state.status || this.status();
    const light = over && !scrolled;
    const ink = light ? '#FFFFFF' : '#1F1520';
    const pre = active === 'home' ? '' : 'Pocetna.dc.html';
    const raw = [
      ['Usluge', pre + '#usluge'], ['Cenovnik', 'Cenovnik.dc.html', 'cenovnik'], ['Rezultati', pre + '#rezultati'],
      ['Galerija', pre + '#galerija'], ['Edukacije', 'Edukacije.dc.html', 'edukacije'], ['O nama', pre + '#o-nama'], ['Kontakt', pre + '#kontakt']
    ];
    const links = raw.map(([label, href, key]) => {
      const cur = key && key === active;
      return { label, href, current: cur ? 'page' : undefined, color: cur ? (light ? '#F6C6DA' : '#C8007B') : ink, under: cur ? 'scaleX(1)' : 'scaleX(0)' };
    });
    const mlinks = [['Početna', active === 'home' ? '#' : 'Pocetna.dc.html']].concat(raw).map(([label, href, key], i) => ({
      label, href, color: key && key === active ? '#C8007B' : '#1F1520',
      op: menu ? 1 : 0, tf: menu ? 'none' : 'translateY(24px)', delay: (menu ? 0.08 + i * 0.05 : 0) + 's'
    }));
    return {
      links, mlinks, ink,
      homeHref: active === 'home' ? '#' : 'Pocetna.dc.html',
      waGeneral: 'https://wa.me/381628931094?text=' + encodeURIComponent('Zdravo! Želela bih da zakažem termin u salonu SKINNY.'),
      statusLabel: st.label,
      dotColor: st.open ? '#3DDC84' : '#9A8C96',
      dotRing: st.open ? 'rgba(61,220,132,.25)' : 'rgba(154,140,150,.25)',
      wrapTf: scrolled ? 'translateY(-36px)' : 'none',
      hdrBg: light ? 'transparent' : 'rgba(251,248,249,.86)',
      hdrBlur: light ? 'none' : 'blur(14px) saturate(1.4)',
      hdrBorder: light ? 'transparent' : 'rgba(238,2,147,.14)',
      hdrPad: scrolled ? '10px' : '18px',
      logoH: scrolled ? '40px' : '50px',
      lightLogoOp: light ? 0 : 1,
      darkLogoOp: light ? 1 : 0,
      burgerBorder: light ? 'rgba(255,255,255,.6)' : 'rgba(31,21,32,.25)',
      menuOpenStr: menu ? 'true' : 'false',
      menuHidden: menu ? 'false' : 'true',
      menuOp: menu ? 1 : 0,
      menuVis: menu ? 'visible' : 'hidden',
      barTf: bar && !menu ? 'none' : 'translateY(110%)',
      fabOp: bar ? 1 : 0,
      fabTf: bar ? 'none' : 'translateY(20px) scale(.8)',
      openMenu: () => this.setMenu(true),
      closeMenu: () => this.setMenu(false),
      closeRef: el => { this.closeEl = el; }
    };
  }
}
</script>
